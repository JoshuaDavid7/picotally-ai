name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-net --allow-env --allow-read supabase/functions/
